name: Smart Elevator RL — Train & Evaluate

on:
  push:
    branches: [main]
    paths:
      - "train.py"
      - "baseline.py"
      - "compare.py"
      - "evaluate.py"
      - "sim/**"
      - "configs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:   

env:
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}   
  MLFLOW_EXPERIMENT_NAME: smart-elevator-rl

jobs:
  # ── 1. Lint & sanity check ─────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt flake8

      - name: Lint with flake8
        run: flake8 train.py baseline.py compare.py evaluate.py --max-line-length=100
    

  # ── 2. Baseline run ────────────────────────────────────────────────────────
  baseline:
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
    name: Baseline (Random Policy)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run baseline
        run: python baseline.py

  # ── 3. Train ───────────────────────────────────────────────────────────────
  train:
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
    name: Train Q-Learning Agent
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create output directories
        run: mkdir -p policies results

      - name: Train agent
        run: python train.py

      - name: Upload policy artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-policy
          path: policies/policy_v1.pkl
          retention-days: 30

      - name: Upload results CSV
        uses: actions/upload-artifact@v4
        with:
          name: training-results
          path: results/results.csv
          retention-days: 30

  # ── 4. Evaluate ────────────────────────────────────────────────────────────
  evaluate:
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
    name: Evaluate Trained Policy
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p policies results

      - name: Download trained policy
        uses: actions/download-artifact@v4
        with:
          name: trained-policy
          path: policies/

      - name: Run evaluation
        run: python evaluate.py

  # ── 5. Compare ─────────────────────────────────────────────────────────────
  compare:
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
    name: Compare RL vs Baseline
    runs-on: ubuntu-latest
    needs: [baseline, evaluate]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p policies results

      - name: Download trained policy
        uses: actions/download-artifact@v4
        with:
          name: trained-policy
          path: policies/

      - name: Run comparison
        run: python compare.py
